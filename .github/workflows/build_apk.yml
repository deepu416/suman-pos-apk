name: Generate Suman Disposal APK

on:
  workflow_dispatch: # Allows manual trigger with 1 click

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Wrapper
        run: |
          mkdir app-build && cd app-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "सुमन डिस्पोजल" "com.sumandisposal.app" --web-dir "."
          
          # Configure Capacitor to wrap the live Netlify PWA
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sumandisposal.app",
            "appName": "सुमन डिस्पोजल",
            "webDir": "www",
            "server": {
              "url": "https://suman-disposal.netlify.app/",
              "cleartext": true
            }
          }
          EOF
          
          mkdir -p www
          echo "<html><body>Redirecting...</body></html>" > www/index.html
          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suman-Disposal-POS-v1
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
